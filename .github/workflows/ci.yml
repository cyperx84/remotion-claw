name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup ffprobe
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install deps
        run: npm ci

      - name: Template list smoke
        run: npm test

      - name: Render smoke
        run: node scripts/smoke-render.mjs

      - name: Pack dry run
        run: npm pack --dry-run
